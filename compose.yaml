services:
  opsark:
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      OPSARK_DATA_DIR: /app/data
      OPSARK_AI_PROVIDER: ${OPSARK_AI_PROVIDER:-openai}
      OPSARK_AI_BASE_URL: ${OPSARK_AI_BASE_URL:-}
      OPSARK_AI_MODEL: ${OPSARK_AI_MODEL:-}
      OPSARK_AI_KEY: ${OPSARK_AI_KEY:-}
      OPSARK_AI_RESPONSE_FORMAT: ${OPSARK_AI_RESPONSE_FORMAT:-json_object}
      OPSARK_AI_TOKEN_LIMIT_PARAMETER: ${OPSARK_AI_TOKEN_LIMIT_PARAMETER:-max_tokens}
      OPSARK_AI_MAX_OUTPUT_TOKENS: ${OPSARK_AI_MAX_OUTPUT_TOKENS:-2048}
      OPSARK_AI_THINKING_MODE: ${OPSARK_AI_THINKING_MODE:-provider_default}
      OPSARK_OBSERVE_ENABLED: ${OPSARK_OBSERVE_ENABLED:-false}
      OPSARK_OBSERVE_HOSTS: ${OPSARK_OBSERVE_HOSTS:-}
      OPSARK_OBSERVE_INTERVAL: ${OPSARK_OBSERVE_INTERVAL:-60}
      OPSARK_WEB_OBSERVE_ENABLED: ${OPSARK_WEB_OBSERVE_ENABLED:-false}
    volumes:
      - opsark-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/status', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  opsark-data:
