[Service]
ExecStartPre=/usr/sbin/nginx -t -q -c /etc/nginx/nginx.conf -g "daemon on; master_process on;"
ExecStartPre=-/usr/bin/python3 -I -B /usr/local/lib/opsark-nginx-action/deploy/nginx/managed_runtime.py pre
ExecStart=
ExecStart=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon on; master_process on;"
ExecStartPost=-/usr/bin/python3 -I -B /usr/local/lib/opsark-nginx-action/deploy/nginx/managed_runtime.py post
