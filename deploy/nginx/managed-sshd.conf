# OpsArk managed Nginx action account. Use as a standalone included file.
Match User opsark-nginx-action
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PubkeyAcceptedAlgorithms ssh-ed25519
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitEmptyPasswords no
    HostbasedAuthentication no
    GSSAPIAuthentication no
    AuthorizedKeysFile /etc/ssh/opsark-nginx-action/authorized_keys
    AuthorizedKeysCommand none
    AuthorizedPrincipalsFile none
    AuthorizedPrincipalsCommand none
    TrustedUserCAKeys none
    ForceCommand /usr/local/lib/opsark-nginx-action/deploy/nginx/managed_ssh_entry.py
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitOpen none
    PermitListen none
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    X11Forwarding no
    ExposeAuthInfo no
    MaxSessions 1
    AcceptEnv OPSARK_UNUSED
