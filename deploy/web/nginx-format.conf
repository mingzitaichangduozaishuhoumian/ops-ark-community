# OpsArk privacy Web observation format v1
# Internal maps inspect request metadata; the access log exports categories only.
map $request_method $opsark_web_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
map $request_uri $opsark_web_path_only {
    default "";
    "~^(?<opsark_web_path_capture>[^?]*)" $opsark_web_path_capture;
}
map $uri $opsark_web_base_class {
    default other;
    / normal;
    /healthz health;
    /robots.txt robots;
    /sitemap.xml robots;
    "~^/(?:static|assets)/" static;
    "~^/(?:callback|webhook)(?:/|$)" callback;
    "~*^/\.env(?:[./]|$)" secret_probe;
    "~*^/\.git(?:/|$)" repo_probe;
    "~*^/(?:wp-login\.php|wp-admin|xmlrpc\.php)(?:/|$)" cms_probe;
    "~*^/(?:phpmyadmin|adminer|manager/html)(?:[./]|$)" admin_probe;
}
map $opsark_web_path_only $opsark_web_path_class {
    default $opsark_web_base_class;
    "~*(?:\.\./|%2e(?:%2e|\.)|\.%2e|%252e)" traversal_probe;
}
map $http_user_agent $opsark_web_client_class {
    default other;
    "~^OpsArk-Controlled-Probe/1$" probe;
    "~*(?:Googlebot|bingbot|DuckDuckBot|Baiduspider|YandexBot)" declared_crawler;
    "~^Mozilla/" browser;
}
map $http_x_forwarded_for $opsark_web_xff {
    default "";
    "~^(?<opsark_web_xff_v4>[0-9]{1,3}(?:\.[0-9]{1,3}){3})$" $opsark_web_xff_v4;
    "~^(?<opsark_web_xff_v6>[0-9A-Fa-f:]{2,39})$" $opsark_web_xff_v6;
}
map $http_cf_connecting_ip $opsark_web_cf_ip {
    default "";
    "~^(?<opsark_web_cf_v4>[0-9]{1,3}(?:\.[0-9]{1,3}){3})$" $opsark_web_cf_v4;
    "~^(?<opsark_web_cf_v6>[0-9A-Fa-f:]{2,39})$" $opsark_web_cf_v6;
}
map $http_x_forwarded_for $opsark_web_xff_present {
    default 1;
    "" 0;
}
map $http_cf_connecting_ip $opsark_web_cf_present {
    default 1;
    "" 0;
}
log_format opsark_web_json escape=json
    '{"schema_version":1,"site_id":"$opsark_web_site","msec":"$msec",'
    '"peer_ip":"$realip_remote_addr","xff":"$opsark_web_xff",'
    '"xff_present":"$opsark_web_xff_present","cf_ip":"$opsark_web_cf_ip",'
    '"cf_present":"$opsark_web_cf_present","method":"$opsark_web_method",'
    '"status":$status,"path_class":"$opsark_web_path_class",'
    '"client_class":"$opsark_web_client_class","request_time":"$request_time",'
    '"bytes_sent":$body_bytes_sent,"request_id":"$request_id"}';
