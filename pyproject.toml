[project]
name = "ops-ark"
version = "0.19.0"
description = "Evidence-based VPS investigation and approved security remediation"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "paramiko>=5.1.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["src"]

# Historical SSH lab receipts pin the source bytes, including its legacy ignore.
[[tool.ty.overrides]]
include = ["deploy/defense/ssh_requests.py"]

[tool.ty.overrides.rules]
unused-ignore-comment = "ignore"
