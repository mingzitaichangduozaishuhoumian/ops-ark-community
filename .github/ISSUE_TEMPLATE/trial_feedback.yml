name: 试用反馈
description: 记录完成了什么、遇到什么阻碍或哪一步容易误解
title: "[试用] "
body:
  - type: markdown
    attributes:
      value: |
        这里的内容公开可见。只填写试用过程的概括，省略真实目标、IP、域名、URL、日志、截图、附件、配置、业务数据和凭据。怀疑有漏洞时，请到本仓库的 Security 页面私密报告，操作见「私密漏洞报告指南」。
  - type: input
    id: version
    attributes:
      label: OpsArk 版本
      description: 填发布版本、短提交号或「未知」。
      placeholder: "例如 v0.19.0"
    validations:
      required: true
  - type: dropdown
    id: console_os
    attributes:
      label: 控制台运行系统
      options:
        - Linux
        - Windows
        - macOS
        - 其他或未知
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: 试用场景
      options:
        - 安装 Python、uv 或项目依赖
        - 本地启动与样本回放
        - 隔离主机接入与只读预检
        - 网站、磁盘或容器调查
        - 报告、复验或交接摘要
        - 其他
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: 试用结果
      options:
        - 独立完成
        - 需要协助后完成
        - 遇到阻碍，未完成
        - 尚未验证结果
    validations:
      required: true
  - type: input
    id: feedback
    attributes:
      label: 完成到哪一步
      description: 用一句话写最后成功的一步、卡住的操作或完成后的情况。终端错误用自己的话概括。
      placeholder: 已解压源码，uv 下载依赖时超时，控制台尚未启动
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开提交确认
      options:
        - label: 我已检查标题和内容，确认未包含真实目标、IP、域名、URL、日志、截图、附件、配置、业务数据或任何凭据。
          required: true
